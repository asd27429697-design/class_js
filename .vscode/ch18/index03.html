<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>도시 날씨 검색</title>
    <link rel="stylesheet" href="app.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .card {
        background: #ffffff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
        text-align: center;
      }
      h1 {
        font-size: 20px;
        margin-bottom: 20px;
        color: #333;
      }
      .search-box {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }
      input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
      }
      button {
        padding: 10px 16px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
      }
      button:hover {
        background-color: #0056b3;
      }
      .result-box,
      .error-box {
        margin-top: 20px;
        padding: 15px;
        border-radius: 8px;
      }
      .result-box {
        background-color: #f0f7ff;
        border: 1px solid #b6d4fe;
        display: none;
      }
      .error-box {
        background-color: #f8d7da;
        border: 1px solid #f5c2c7;
        color: #842029;
        display: none;
      }
      .info-group {
        margin: 10px 0;
        text-align: left;
      }
      .info-title {
        font-weight: bold;
        color: #0056b3;
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>도시 날씨 검색</h1>

      <!-- 검색 영역 -->
      <div class="search-box">
        <input type="text" id="cityInput" placeholder="도시명 입력 (예: Seoul, Tokyo)" />
        <button id="searchBtn">검색</button>
      </div>

      <!-- 오류 메시지 영역 -->
      <div id="errorBox" class="error-box"></div>

      <!-- 결과 표시 영역 -->
      <div id="resultBox" class="result-box">
        <div class="info-group">
          <div class="info-title">도시 위치 정보</div>
          <div id="locationInfo">-</div>
        </div>
        <hr style="border: 0; border-top: 1px dashed #b6d4fe; margin: 12px 0" />
        <div class="info-group">
          <div class="info-title">현재 날씨 정보</div>
          <div id="weatherInfo">-</div>
        </div>
      </div>
    </div>

    <script src="app2.js"></script>
  </body>
</html>
