    <script>
      console.log("1. 블록 밖으로 새어 나온다");

      if (true) {
        var oldStyle = "var 로 만든 변수";
        let newStyle = "let 으로 만든 변수";
      }

      console.log(oldStyle); // if 블로 밖인데 읽힌다.
      // console.log(newStyle); // Uncaught Reference let 으로 만든 변수

      console.log("1. for 문에서 특히 위험하다");
      for (var i = 0; i < 3; i++) {}
      // 반복문 종료 후 i 값 확인
      console.log(i);

      for (let j = 0; j < 3; j++) {}
      // 반복문 종료 후 j 값 확인 (let으로 변수 선언)
      // console.log(j);

      console.log("3. 같은 이름으로 변수를 다시 선언해도 에러가 다시 발생하지 않는다.");
      var username = "홍길동";
      var username = "이순신"; // 실수로 다시 선언했는데 에러 없이 덮어쓴다.
      console.log(username);
    </script>
